# 放在專案的 .github/workflows/build-mac.yml
# 到 GitHub → Actions → "Build macOS" → Run workflow，跑完在頁面底部下載 StockMonitor-mac
name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StockMonitor-mac
          path: StockMonitor.dmg
